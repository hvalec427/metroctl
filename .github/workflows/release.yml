name: Build & Release

on:
  push:
    branches:
      - master  # stable
      - develop # dev: rolling build on every commit
  schedule:
    # Nightly from develop, 23:00 Ljubljana in summer (CEST), 22:00 in winter —
    # GitHub cron is UTC-only.
    - cron: "0 21 * * *"
  workflow_dispatch: {} # nightly (also on demand)

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Scheduled runs always use the workflow file on the default branch (master),
  # which lags develop. This job only re-dispatches the workflow on develop, so
  # the nightly build runs develop's own definition.
  trigger-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch nightly on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref develop

  release:
    if: github.event_name != 'schedule'
    # macOS: binaries are built for both Apple targets and ad-hoc code-signed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Manual runs may be started on any branch; nightlies always build develop.
      - name: Build from develop (nightly)
        if: github.event_name != 'push'
        run: |
          git fetch origin develop --tags
          git checkout -B develop origin/develop

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # master push → stable release, next patch above the latest stable.
      - name: Stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/stable-release.sh

      # develop push → rolling "dev" prerelease.
      - name: Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev-release.sh

      # workflow_dispatch (from the schedule, or manual) → date-stamped nightly.
      - name: Nightly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/nightly-release.sh
