name: Build & Release

on:
  push:
    tags:
      - "v*" # stable release at that version
    branches:
      - main # rolling "dev" build on every commit
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # macOS: binaries are built for both Apple targets and ad-hoc code-signed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Tag push → stable release at that version.
      - name: Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-binaries.sh "$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "metroctl $VERSION" \
            metroctl-darwin-arm64 metroctl-darwin-x64

      # main push / manual → rolling "dev" prerelease.
      - name: Dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev-release.sh
