name: Build & Release

on:
  push:
    tags:
      - "v*" # stable release at that version
    branches:
      - main # rolling "dev" build on every commit
  schedule:
    - cron: "0 23 * * *" # nightly prerelease from develop
  workflow_dispatch: {} # manual nightly on demand

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # macOS: binaries are built for both Apple targets and ad-hoc code-signed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled / manual runs build the nightly from develop.
      - name: Build from develop (nightly)
        if: github.event_name != 'push'
        run: |
          git fetch origin develop --tags
          git checkout -B develop origin/develop

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Tag push → stable release at that version.
      - name: Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-binaries.sh "$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "metroctl $VERSION" \
            metroctl-darwin-arm64 metroctl-darwin-x64

      # main push → rolling "dev" prerelease.
      - name: Dev build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/dev-release.sh

      # schedule / manual → date-stamped nightly prerelease from develop.
      - name: Nightly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/nightly-release.sh
